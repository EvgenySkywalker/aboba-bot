[project]
name = "aboba-bot"
version = "0.1.0"
description = "bot for tracking our spendings"
authors = ["ianakievgenii@gmail.com"]
package-mode = false
requires-python = ">=3.14"
dependencies = [
    "python-telegram-bot (>=22.8,<23.0)",
    "google-genai[aiohttp] (>=2.18.1,<3.0.0)",
    "gspread (>=6.2.1,<7.0.0)",
    "google-auth (>=2.56.3,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "aiohttp (>=3.14.3,<4.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
